<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키퍼 브리핑 — CoC 마스터링 어시스턴트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --void:#0f1310;
  --panel:#161c18;
  --elevated:#202822;
  --hairline:#2c352e;
  --verdigris:#5c9c7c;
  --verdigris-soft:rgba(92,156,124,0.18);
  --verdigris-dim:rgba(92,156,124,0.45);
  --parchment:#eae4d3;
  --parchment-dim:#a8a99a;
  --muted:#767f74;
  --rust:#b5583f;
  --rust-soft:rgba(181,88,63,0.16);
  --font-display:'Noto Serif KR', serif;
  --font-body:'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--void);
  color:var(--parchment);
  font-family:var(--font-body);
  min-height:100vh;
  min-height:100dvh;
  line-height:1.6;
}

/* ============ layout ============ */
#app{display:flex; min-height:100vh; min-height:100dvh;}

#sidebarOverlay{
  display:none;
  position:fixed; inset:0;
  background:rgba(0,0,0,0.55);
  z-index:45;
}
#sidebarOverlay.show{ display:block; }

#sidebar{
  width:260px;
  min-width:260px;
  background:var(--panel);
  border-right:1px solid var(--hairline);
  display:flex;
  flex-direction:column;
  padding:14px 12px 0;
  position:sticky;
  top:0;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  transition:transform 0.2s ease;
}
#sidebar.collapsed{ transform:translateX(-100%); position:fixed; z-index:50; }

.sidebar-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
  flex-shrink:0;
}
#sidebarCloseBtn{
  display:none;
  background:var(--elevated);
  border:1px solid var(--hairline);
  color:var(--parchment-dim);
  font-size:16px;
  width:32px; height:32px;
  border-radius:8px;
  cursor:pointer;
  flex-shrink:0;
}
.sidebar-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  padding-bottom:8px;
}

.brand{
  font-family:var(--font-display);
  font-weight:700;
  font-size:17px;
  color:var(--parchment);
  padding:6px 6px 4px;
  letter-spacing:0.02em;
}
.brand-sub{
  font-size:11px;
  color:var(--muted);
  padding:0 6px 16px;
  letter-spacing:0.03em;
}
.new-btn{
  display:flex; align-items:center; gap:8px;
  background:var(--verdigris-soft);
  border:1px solid var(--verdigris-dim);
  color:var(--verdigris);
  font-weight:600;
  font-size:13px;
  padding:10px 12px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:14px;
}
.new-btn:hover{ background:rgba(92,156,124,0.28); }
.new-btn-alt{
  background:var(--elevated);
  border-color:var(--hairline);
  color:var(--parchment-dim);
  margin-bottom:16px;
}
.new-btn-alt:hover{ border-color:var(--verdigris-dim); color:var(--parchment); background:var(--elevated); }

#historyLabel{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.08em;
  padding:4px 8px 8px;
}
#historyList{ list-style:none; margin:0; padding:0; }
#historyList li{
  padding:9px 10px;
  border-radius:7px;
  cursor:pointer;
  font-size:13px;
  margin-bottom:2px;
  color:var(--parchment-dim);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
}
#historyList li:hover{ background:var(--elevated); color:var(--parchment); }
#historyList li.active{ background:var(--verdigris-soft); color:var(--verdigris); font-weight:600; }
#historyList .doc-title-wrap{ overflow:hidden; flex:1; }
#historyList .doc-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
#historyList .doc-provider{ font-size:10px; color:var(--muted); }
#historyList li.active .doc-provider{ color:var(--verdigris-dim); }
#historyList .doc-del{
  opacity:0; font-size:11px; color:var(--muted); padding:2px 5px; border-radius:4px; flex-shrink:0;
}
#historyList li:hover .doc-del{ opacity:1; }
#historyList .doc-del:hover{ background:var(--rust-soft); color:var(--rust); }

.sidebar-footer{
  border-top:1px solid var(--hairline);
  padding:10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
  flex-shrink:0;
}
.settings-btn{
  width:100%;
  background:transparent;
  border:1px solid var(--hairline);
  color:var(--parchment-dim);
  font-size:12px;
  padding:9px 10px;
  border-radius:7px;
  cursor:pointer;
  text-align:left;
}
.settings-btn:hover{ border-color:var(--verdigris-dim); color:var(--parchment); }

#main{ flex:1; min-width:0; display:flex; flex-direction:column; }

#topbar{
  display:flex; align-items:center; gap:10px;
  padding:12px 20px;
  border-bottom:1px solid var(--hairline);
  position:sticky; top:0; background:var(--void); z-index:10;
}
#menuToggle{
  display:none;
  background:none; border:none; color:var(--parchment); font-size:18px; cursor:pointer;
  padding:4px 8px;
}
#topbarTitle{ font-family:var(--font-display); font-size:15px; color:var(--parchment-dim); }

#content{ flex:1; padding:28px; max-width:920px; width:100%; margin:0 auto; }

/* ============ intake form ============ */
.card{
  background:var(--panel);
  border:1px solid var(--hairline);
  border-radius:12px;
  padding:22px;
}
.section-title{
  font-family:var(--font-display);
  font-size:20px;
  font-weight:700;
  margin:0 0 4px;
}
.section-desc{ color:var(--muted); font-size:13px; margin:0 0 18px; }

label.field-label{
  display:block; font-size:12px; color:var(--parchment-dim); margin-bottom:6px; font-weight:600;
}
input[type=text], input[type=password], textarea, select{
  width:100%;
  background:var(--elevated);
  border:1px solid var(--hairline);
  color:var(--parchment);
  border-radius:8px;
  padding:10px 12px;
  font-family:var(--font-body);
  font-size:14px;
  outline:none;
}
input[type=text]:focus, input[type=password]:focus, textarea:focus, select:focus{ border-color:var(--verdigris-dim); }
textarea{ min-height:220px; resize:vertical; line-height:1.6; }
textarea.prompt-area{ min-height:180px; font-size:13px; }
.field-gap{ margin-bottom:16px; }

.upload-row{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.file-btn{
  background:var(--elevated);
  border:1px dashed var(--hairline);
  color:var(--parchment-dim);
  padding:9px 14px;
  border-radius:8px;
  font-size:13px;
  cursor:pointer;
}
.file-btn:hover{ border-color:var(--verdigris-dim); color:var(--parchment); }
#pdfFileName{ font-size:12px; color:var(--verdigris); }

.primary-btn{
  background:var(--verdigris);
  color:#0f1310;
  border:none;
  font-weight:700;
  font-size:14px;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}
.primary-btn:hover{ filter:brightness(1.08); }
.primary-btn:disabled{ opacity:0.5; cursor:not-allowed; }

.hint{ font-size:12px; color:var(--muted); margin-top:8px; }

.provider-pill-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.provider-pill{
  border:1px solid var(--hairline);
  background:var(--elevated);
  color:var(--parchment-dim);
  font-size:12.5px;
  padding:7px 12px;
  border-radius:20px;
  cursor:pointer;
}
.provider-pill.active{ border-color:var(--verdigris-dim); background:var(--verdigris-soft); color:var(--verdigris); font-weight:600; }
.provider-pill.unset{ opacity:0.45; }

/* ============ loading ============ */
#loadingView{ text-align:center; padding:60px 20px; color:var(--parchment-dim); }
.seal-spin{
  width:52px; height:52px; margin:0 auto 18px;
  border:2px solid var(--hairline);
  border-top-color:var(--verdigris);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
#loadingMsg{ font-size:13px; color:var(--muted); }

/* ============ results ============ */
.result-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
.result-title{ font-family:var(--font-display); font-size:22px; font-weight:700; }
.result-provider-tag{ font-size:11px; color:var(--verdigris); margin-top:4px; }
.result-actions{ display:flex; gap:8px; }
.ghost-btn{
  background:transparent; border:1px solid var(--hairline); color:var(--parchment-dim);
  padding:7px 12px; border-radius:7px; font-size:12px; cursor:pointer;
}
.ghost-btn:hover{ border-color:var(--verdigris-dim); color:var(--parchment); }

.folio{
  border:1px solid var(--hairline);
  border-radius:10px;
  margin-bottom:14px;
  background:var(--panel);
  overflow:hidden;
}
.folio-head{
  display:flex; align-items:center; gap:10px;
  padding:14px 16px;
  cursor:pointer;
  user-select:none;
}
.folio-icon{ font-size:16px; color:var(--verdigris); flex-shrink:0; }
.folio-name{ font-family:var(--font-display); font-weight:700; font-size:15px; flex:1; }
.folio-chevron{ color:var(--muted); font-size:12px; transition:transform 0.15s; }
.folio.open .folio-chevron{ transform:rotate(90deg); }
.folio-body{ display:none; padding:0 18px 18px; border-top:1px solid var(--hairline); }
.folio.open .folio-body{ display:block; padding-top:14px; }

.folio-body p{ margin:0 0 10px; font-size:14px; color:var(--parchment); }
.folio-body ul{ margin:0 0 10px; padding-left:20px; font-size:14px; }
.folio-body li{ margin-bottom:6px; }

/* ============ modal ============ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.6);
  display:flex; align-items:center; justify-content:center; z-index:100;
  padding:20px;
}
.hidden{ display:none !important; }
.modal-overlay.hidden{ display:none; }
.modal-box{
  background:var(--panel);
  border:1px solid var(--hairline);
  border-radius:12px;
  width:480px; max-width:100%;
  max-height:88vh;
  overflow-y:auto;
  padding:20px;
}
.modal-box h3{ font-family:var(--font-display); margin:0 0 4px; font-size:17px; }
.modal-box .modal-sub{ color:var(--muted); font-size:12px; margin:0 0 16px; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
.modal-section-label{
  font-size:11px; color:var(--verdigris); text-transform:uppercase; letter-spacing:0.08em;
  font-weight:700; margin:20px 0 10px; padding-top:14px; border-top:1px solid var(--hairline);
}
.modal-section-label:first-of-type{ border-top:none; padding-top:0; margin-top:0; }

.key-row{ display:flex; gap:8px; align-items:center; }
.key-row input{ flex:1; }
.icon-btn{
  background:var(--elevated); border:1px solid var(--hairline); color:var(--parchment-dim);
  border-radius:8px; padding:0 12px; height:40px; cursor:pointer; font-size:13px; flex-shrink:0;
}
.icon-btn:hover{ border-color:var(--verdigris-dim); color:var(--parchment); }
.test-result{ font-size:12px; margin-top:6px; min-height:16px; }
.test-result.ok{ color:var(--verdigris); }
.test-result.fail{ color:var(--rust); }

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--elevated); border:1px solid var(--verdigris-dim); color:var(--parchment);
  padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none;
  transition:opacity 0.2s; z-index:200; max-width:90vw; text-align:center;
}
.toast.show{ opacity:1; }

/* ============ 스크립트 정리 ============ */
.mode-tabs{ display:flex; gap:8px; margin-bottom:18px; }
.mode-tab{
  flex:1; text-align:center;
  background:var(--elevated); border:1px solid var(--hairline); color:var(--parchment-dim);
  padding:10px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer;
}
.mode-tab.active{ background:var(--verdigris-soft); border-color:var(--verdigris-dim); color:var(--verdigris); }
.name-row{ display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.name-row > div{ flex:1; min-width:140px; }
.opt-row{ display:flex; gap:16px; align-items:center; margin:4px 0 16px; flex-wrap:wrap; }
.opt-check{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--parchment-dim); cursor:pointer; }
.opt-check input{ accent-color:var(--verdigris); width:15px; height:15px; }
.btn-row{ display:flex; gap:10px; }
.btn-row .primary-btn{ flex:1; }

.script-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.script-title{ font-family:var(--font-display); font-size:20px; font-weight:700; }
.script-sub{ font-size:12px; color:var(--muted); margin-top:4px; }

.block-list{ border:1px solid var(--hairline); border-radius:10px; overflow:hidden; }
.script-block{
  padding:13px 16px;
  border-bottom:1px solid var(--hairline);
  position:relative;
  font-size:14px;
  line-height:1.6;
}
.script-block:last-child{ border-bottom:none; }
.script-block.type-bgm{ background:rgba(90,120,180,0.22); }
.script-block.type-handout{ background:rgba(170,120,60,0.22); }
.script-block.type-kp{ background:rgba(80,150,100,0.22); }
.script-block.type-heading{ background:rgba(92,156,124,0.16); font-weight:700; font-family:var(--font-display); }
.script-block.type-skill{ background:rgba(181,88,63,0.28); font-weight:700; }
.script-block.type-skill-result{ background:rgba(181,88,63,0.10); }
.script-block.type-annot-label{ background:rgba(140,140,150,0.30); font-weight:700; }
.script-block.type-annot{ background:rgba(140,140,150,0.14); }
.script-block.type-dialogue{ background:rgba(150,120,180,0.16); }
.block-speaker{ font-size:11.5px; color:var(--verdigris); font-weight:700; margin-bottom:3px; }
.block-type-select{
  background:var(--elevated); border:1px solid var(--hairline); color:var(--parchment-dim);
  font-size:11px; border-radius:5px; padding:2px 4px; cursor:pointer;
}
.block-text{ outline:none; word-break:break-word; }
.block-text[contenteditable="true"]{ border-bottom:1px dashed var(--verdigris-dim); }
.block-actions{
  display:flex; gap:10px; align-items:center; margin-top:6px;
  font-size:11.5px;
}
.block-actions span{ color:var(--muted); cursor:pointer; }
.block-actions span:hover{ color:var(--verdigris); }
.block-actions .del-action:hover{ color:var(--rust); }
.script-empty{ color:var(--muted); text-align:center; padding:30px; font-size:13px; }

.multi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px; }
@media (min-width:600px){ .multi-grid{ grid-template-columns:repeat(4,1fr); } }
.multi-grid .field-label{ margin-bottom:4px; }

.stats-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.stats-pill{
  background:var(--elevated); border:1px solid var(--hairline); color:var(--parchment-dim);
  padding:6px 12px; border-radius:20px; font-size:12px;
}

.link-card{ border:1px solid var(--hairline); border-radius:10px; padding:14px 16px; margin-bottom:14px; background:var(--panel); }
.link-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.link-card-head .field-label{ margin:0; }
.link-row{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  background:var(--elevated); border:1px solid var(--hairline); border-radius:6px;
  padding:8px 10px; margin-bottom:6px; font-size:12.5px;
}
.link-row a{ color:var(--verdigris); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:75%; }

.script-block.playable{ cursor:pointer; }
.script-block.play-current{ box-shadow:inset 0 0 0 2px var(--verdigris); background:rgba(92,156,124,0.16); }
.script-block.type-dialogue{ background:rgba(150,120,180,0.16); }
#floatingNextBtn{
  position:fixed; bottom:22px; right:18px; z-index:60;
  background:var(--verdigris); color:#0f1310; border:none; font-weight:700;
  padding:12px 18px; border-radius:10px; font-size:13px; cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,0.35);
}

@media (max-width: 760px){
  #sidebar{ position:fixed; z-index:50; transform:translateX(-100%); }
  #sidebar.open{ transform:translateX(0); }
  #menuToggle{ display:inline-block; }
  #sidebarCloseBtn{ display:inline-block; }
  #content{ padding:18px; }
}
</style>
</head>
<body>

<div id="app">
  <div id="sidebarOverlay" onclick="setSidebarOpen(false)"></div>
  <aside id="sidebar">
    <div class="sidebar-head">
      <div>
        <div class="brand">키퍼 브리핑</div>
        <div class="brand-sub">CoC 마스터링 어시스턴트</div>
      </div>
      <button id="sidebarCloseBtn" onclick="setSidebarOpen(false)">✕</button>
    </div>
    <button class="new-btn" onclick="startNewAnalysis()">＋ 새 시나리오 분석</button>
    <button class="new-btn new-btn-alt" onclick="startNewScript()">＋ 새 스크립트 정리</button>
    <div class="sidebar-scroll">
      <div id="historyLabel">지난 분석</div>
      <ul id="historyList"></ul>
    </div>
    <div class="sidebar-footer">
      <button class="settings-btn" onclick="openSettings()">⚙ AI 설정</button>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <button id="menuToggle" onclick="toggleSidebar()">☰</button>
      <div id="topbarTitle">시나리오 사전 브리핑 도구</div>
    </div>
    <div id="content">
      <!-- 뷰가 여기 렌더링됩니다 -->
    </div>
  </main>
</div>

<!-- 설정 모달 -->
<div id="settingsModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>⚙ 설정</h3>
    <div class="modal-sub">API 키는 이 브라우저(localStorage)에만 저장되며 서버로 전송되지 않습니다.</div>

    <div class="modal-section-label">🤖 AI CONFIGURATION</div>

    <label class="field-label">편집할 공급자</label>
    <select id="settingsProviderSelect" class="field-gap" onchange="renderProviderFields()">
      <option value="gemini">Google Gemini</option>
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic Claude</option>
      <option value="deepseek">DeepSeek</option>
      <option value="custom">커스텀 (Custom)</option>
    </select>

    <div id="providerFieldsContainer"></div>

    <div class="key-row field-gap">
      <button class="icon-btn" onclick="handleTestConnection()">⚡ 연결 테스트</button>
      <span class="test-result" id="testResult"></span>
    </div>

    <div class="modal-section-label">📝 SYSTEM PROMPT</div>
    <div class="hint" style="margin:0 0 8px;">AI 역할과 출력 형식을 정의합니다. 기본값이 입력되어 있으니 필요한 부분만 고쳐 쓰세요.</div>
    <textarea id="systemPromptInput" class="prompt-area field-gap"></textarea>
    <button class="ghost-btn" onclick="resetSystemPrompt()">기본값으로 되돌리기</button>

    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeSettings()">닫기</button>
      <button class="primary-btn" onclick="saveSettings()">저장</button>
    </div>
  </div>
</div>

<div id="scriptPasswordModal" class="modal-overlay hidden">
  <div class="modal-box" style="width:340px;">
    <h3>🔒 스크립트 정리</h3>
    <div class="modal-sub">암호를 입력하면 이 브라우저에서는 다시 묻지 않습니다.</div>
    <input type="password" id="scriptPasswordInput" class="field-gap" placeholder="암호" onkeydown="if(event.key==='Enter') submitScriptPassword()">
    <div class="test-result" id="scriptPasswordResult"></div>
    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeScriptPasswordModal()">취소</button>
      <button class="primary-btn" onclick="submitScriptPassword()">확인</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   상수 & 상태
============================================================ */
const DB_NAME = 'keeper-briefing';
const DB_VERSION = 1;
const STORE = 'analyses';
let db = null;
let currentDoc = null;

function formatProviderTag(record){
  const label = PROVIDER_LABELS[record.provider] || record.provider || '';
  if (record.model) return `${label} · ${record.model}`;
  return label;
}

다음 원칙을 반영하세요:
- 시나리오 원문을 그대로 베끼지 말고 요약·재구성할 것

- 제안하는 팁이 원문에 명시된 공식 규칙·장치인지, 당신이 새롭게 제안하는 아이디어인지 구분해서 표기할 것 (예: "(원문 공식 규칙)" / "(제안)")
- NPC는 즉석 연기가 쉽도록 말투·인상·스테레오타입 하나를 짚어줄 것
- 플레이어가 시나리오를 이탈할 수 있는 분기점과 유연하게 대응하는 방법을 짚어줄 것
- 묘사·연출 제안은 실제 장면에 바로 쓸 수 있는 구체적 문장(나레이션·대사 예시 포함)으로 제시할 것

/* ============================================================
   IndexedDB
============================================================ */
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const _db = e.target.result;
      if (!_db.objectStoreNames.contains(STORE)) {
        const store = _db.createObjectStore(STORE, { keyPath: 'id' });
        store.createIndex('createdAt', 'createdAt');
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}
function dbPut(record){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(record);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}
function dbGetAll(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result.sort((a,b) => b.createdAt - a.createdAt));
    req.onerror = (e) => reject(e.target.error);
  });
}
function dbDelete(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}

async function refreshHistory(){
  const list = document.getElementById('historyList');
  const items = await dbGetAll();
  list.innerHTML = '';
  if (items.length === 0){
    list.innerHTML = '<li style="color:var(--muted); cursor:default;">아직 분석 기록이 없습니다</li>';
    return;
  }
  items.forEach(item => {
    const li = document.createElement('li');
    if (currentDoc && currentDoc.id === item.id) li.classList.add('active');
    const isScript = item.type === 'script';
    const typeIcon = isScript ? '✂️' : '📋';
    const subLabel = isScript ? `${item.kpcName||'KPC'} / ${item.pcName||'PC'}` : formatProviderTag(item);
    li.innerHTML = `<span class="doc-title-wrap"><span class="doc-title">${typeIcon} ${escapeHtml(item.title)}</span><span class="doc-provider">${escapeHtml(subLabel)}</span></span><span class="doc-del" onclick="event.stopPropagation(); deleteAnalysis('${item.id}')">✕</span>`;
    li.onclick = () => loadAnalysis(item.id);
    list.appendChild(li);
  });
}

async function loadAnalysis(id){
  const items = await dbGetAll();
  const item = items.find(i => i.id === id);
  if (!item) return;
  if (item.type === 'script'){
    requireScriptUnlock(() => openScriptRecord(item));
    return;
  }
  currentDoc = item;
  cleanupScriptPlayMode();
  renderResultView(item);
  await refreshHistory();
  closeSidebarOnMobile();
}

  currentDoc = item;

  closeSidebarOnMobile();
}

async function deleteAnalysis(id){

  await dbDelete(id);
  if (currentDoc && currentDoc.id === id){
    currentDoc = null;
    renderIntakeView();
  }
  await refreshHistory();
}

/* ============================================================
   스크립트 정리 — 암호 게이트
   비밀번호 원문은 코드 어디에도 저장하지 않고 SHA-256 해시만 비교한다.
============================================================ */
const SCRIPT_PASSWORD_HASH = '4d4bfac08d0bfdf33089104409b8d59289cfd7d22ca325c4a20584a73ca35759';
let scriptUnlocked = localStorage.getItem('kb_script_unlocked') === 'true';
let pendingScriptAction = null;

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function requireScriptUnlock(action){
  if (scriptUnlocked){ action(); return; }
  pendingScriptAction = action;
  document.getElementById('scriptPasswordInput').value = '';
  document.getElementById('scriptPasswordResult').textContent = '';
  document.getElementById('scriptPasswordModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('scriptPasswordInput').focus(), 50);
}

function closeScriptPasswordModal(){
  document.getElementById('scriptPasswordModal').classList.add('hidden');
  pendingScriptAction = null;
}

async function submitScriptPassword(){
  const val = document.getElementById('scriptPasswordInput').value;
  const hash = await sha256Hex(val);
  const resultEl = document.getElementById('scriptPasswordResult');
  if (hash === SCRIPT_PASSWORD_HASH){
    scriptUnlocked = true;
    localStorage.setItem('kb_script_unlocked', 'true');
    document.getElementById('scriptPasswordModal').classList.add('hidden');
    const action = pendingScriptAction;
    pendingScriptAction = null;
    if (action) action();
  } else {
    resultEl.className = 'test-result fail';
    resultEl.textContent = '✕ 암호가 올바르지 않습니다';
  }
}

/* ============================================================
   PDF 텍스트 추출 — 좌표(줄/문단) 기반 재구성
   pdf.js 텍스트 아이템의 y좌표로 같은 줄을 묶고, 줄 간격을
   페이지 내 중앙값과 비교해 실제 문단 구분과 단순 줄바꿈을 구별한다.
============================================================ */
async function extractPdfPageText(page){
  const content = await page.getTextContent();
  const items = content.items.filter(it => it.str !== undefined);
  if (!items.length) return '';

  const Y_TOL = 2;
  const lines = [];
  let curLine = null;
  for (const it of items){
    const y = it.transform[5];
    if (!curLine || Math.abs(curLine.y - y) > Y_TOL){
      curLine = { y, items: [] };
      lines.push(curLine);
    }
    curLine.items.push(it.str);
  }

  const lineTexts = lines
    .map(line => ({ y: line.y, text: line.items.join('').replace(/\s+/g, ' ').trim() }))
    .filter(l => l.text !== '');
  if (!lineTexts.length) return '';

  const gaps = [];
  for (let i = 1; i < lineTexts.length; i++){
    const g = lineTexts[i-1].y - lineTexts[i].y;
    if (g > 0) gaps.push(g);
  }
  gaps.sort((a,b) => a - b);
  const median = gaps.length ? gaps[Math.floor(gaps.length/2)] : 15;

  let out = '';
  let prev = null;
  for (const line of lineTexts){
    if (prev === null){
      out += line.text;
    } else {
      const gap = prev.y - line.y;
      if (gap <= 0 || gap > median * 1.6){
        out += '\n\n' + line.text;
      } else {
        out += ' ' + line.text;
      }
    }
    prev = line;
  }
  return out.replace(/\n{3,}/g, '\n\n').replace(/ {2,}/g, ' ').trim();
}

async function extractPdfText(file, onProgress){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pageTexts = [];
  for (let i = 1; i <= pdf.numPages; i++){
    if (onProgress) onProgress(i, pdf.numPages);
    const page = await pdf.getPage(i);
    pageTexts.push(await extractPdfPageText(page));
  }
  return { text: pageTexts.filter(Boolean).join('\n\n'), numPages: pdf.numPages };
}

async function handlePdfUpload(e){
  const file = e.target.files[0];
  if (!file) return;
  const nameEl = document.getElementById('pdfFileName');
  nameEl.textContent = `추출 중... (${file.name})`;
  try {
    const { text, numPages } = await extractPdfText(file, (i, total) => {
      nameEl.textContent = `추출 중... (${file.name}) ${i}/${total}페이지`;
    });
    document.getElementById('scenarioText').value = text;
    nameEl.textContent = `✓ ${file.name} (${numPages}페이지 추출 완료)`;
    if (!document.getElementById('titleInput').value){
      document.getElementById('titleInput').value = file.name.replace(/\.pdf$/i, '');
    }
  } catch (err){
    console.error(err);
    nameEl.textContent = '추출 실패 — 본문을 직접 붙여넣어 주세요';
  }
}

async function runAnalysis(){

  const cfg = providersState[provider] || {};
  const systemPrompt = localStorage.getItem('kb_system_prompt') || DEFAULT_SYSTEM_PROMPT;
  const title = document.getElementById('titleInput').value.trim() || '제목 없는 시나리오';

  if (!cfg.apiKey){

    document.getElementById('settingsProviderSelect').value = provider;

  if (!text){
    showToast('시나리오 본문을 입력하거나 PDF를 업로드해주세요');
    return;
  }
  const MAX_CHARS = 180000;
  if (text.length > MAX_CHARS) text = text.slice(0, MAX_CHARS);

  const displayName = (provider === 'custom' && cfg.model) ? cfg.model : PROVIDER_LABELS[provider];
  renderLoadingView(displayName);

  currentAnalysisAbort = new AbortController();
  try {
    const rawText = await callAI(provider, cfg, systemPrompt, text, currentAnalysisAbort.signal);
    const record = {
      id: uid(),
      type: 'briefing',
      title,
      provider,
      model: cfg.model || PROVIDER_DEFAULT_MODEL[provider] || '',
      createdAt: Date.now(),
      rawText
    };
    await dbPut(record);
    currentDoc = record;
    renderResultView(record);
    await refreshHistory();
  } catch (err){
    console.error(err);
    if (err.name === 'AbortError'){
      renderErrorView('사용자가 분석을 취소했습니다.');
    } else {
      renderErrorView(explainApiError(err.message || '분석 중 오류가 발생했습니다'));
    }
  } finally {
    stopLoadingTimer();
    currentAnalysisAbort = null;
  }
}

function explainApiError(msg){
  if (/\b504\b/.test(msg)){
    return msg + '\n\n(504 = Gateway Timeout — 우리 앱이 아니라 중간 프록시/게이트웨이가 실제 AI 모델의 응답을 기다리다 시간 초과로 끊은 것입니다. 모델명이 올바른지, 프록시 서비스 상태를 확인해보세요.)';
  }
  if (/\b502\b/.test(msg)){
    return msg + '\n\n(502 = Bad Gateway — 프록시/게이트웨이가 업스트림 서버로부터 잘못된 응답을 받았습니다. 엔드포인트 URL이나 모델명을 확인해보세요.)';
  }
  if (/\b401\b/.test(msg)){
    return msg + '\n\n(401 = 인증 실패 — API 키가 잘못되었거나 만료되었을 수 있습니다.)';
  }
  if (/\b429\b/.test(msg)){
    return msg + '\n\n(429 = 요청 한도 초과 — 잠시 후 다시 시도해주세요.)';
  }
  return msg;
}

function cancelAnalysis(){
  if (currentAnalysisAbort) currentAnalysisAbort.abort();
}

function stopLoadingTimer(){
  if (loadingTimerInterval){ clearInterval(loadingTimerInterval); loadingTimerInterval = null; }
}

function renderLoadingView(displayName){
  document.getElementById('content').innerHTML = `
    <div id="loadingView">
      <div class="seal-spin"></div>
      <div style="font-family:var(--font-display); font-size:16px; margin-bottom:6px;">${escapeHtml(displayName)}${particleRo(displayName)} 시나리오를 분석하고 있습니다…</div>
      <div id="loadingMsg">세계관, NPC, 주의사항, 연출 포인트를 정리하는 중</div>
      <div id="loadingElapsed" style="margin-top:10px; font-size:12px; color:var(--muted);">경과 시간: 0:00</div>
      <button class="ghost-btn" style="margin-top:16px;" onclick="cancelAnalysis()">취소</button>
    </div>
  `;
  const startedAt = Date.now();
  stopLoadingTimer();
  loadingTimerInterval = setInterval(() => {
    const el = document.getElementById('loadingElapsed');
    if (!el){ stopLoadingTimer(); return; }
    const sec = Math.floor((Date.now() - startedAt) / 1000);
    const m = Math.floor(sec / 60);
    const s = String(sec % 60).padStart(2, '0');
    el.textContent = `경과 시간: ${m}:${s}`;
    if (sec === 60 || sec === 180) el.textContent += ' — 시나리오가 길면 원래 오래 걸릴 수 있어요';
  }, 1000);
}

/* ============================================================
   AI 호출 — 공급자별 디스패치
============================================================ */
async function callAI(provider, cfg, systemPrompt, userText, signal){
  const userMsg = `다음 시나리오를 분석해줘:\n\n${userText}`;
  switch(provider){
    case 'anthropic':
      return callAnthropic(cfg.apiKey, cfg.model || PROVIDER_DEFAULT_MODEL.anthropic, systemPrompt, userMsg, signal);
    case 'gemini':
      return callGemini(cfg.apiKey, cfg.model || PROVIDER_DEFAULT_MODEL.gemini, systemPrompt, userMsg, signal);
    case 'openai':
      return callOpenAICompatible(cfg.apiKey, 'https://api.openai.com/v1/chat/completions', cfg.model || PROVIDER_DEFAULT_MODEL.openai, systemPrompt, userMsg, signal);
    case 'deepseek':
      return callOpenAICompatible(cfg.apiKey, 'https://api.deepseek.com/chat/completions', cfg.model || PROVIDER_DEFAULT_MODEL.deepseek, systemPrompt, userMsg, signal);
    case 'custom':
      if (!cfg.endpoint) throw new Error('커스텀 엔드포인트 URL을 설정해주세요');
      return callOpenAICompatible(cfg.apiKey, cfg.endpoint, cfg.model, systemPrompt, userMsg, signal);
    default:
      throw new Error('알 수 없는 AI 공급자입니다');
  }
}

async function callAnthropic(apiKey, model, systemPrompt, userMsg, signal){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    signal,
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: model,
      max_tokens: 8000,
      system: systemPrompt,
      messages: [{ role: 'user', content: userMsg }]
    })
  });
  if (!res.ok){ throw new Error(`Anthropic API 오류 (${res.status}): ${(await res.text()).slice(0,200)}`); }
  const data = await res.json();
  const block = (data.content || []).find(b => b.type === 'text');
  if (!block) throw new Error('응답에서 분석 결과를 찾지 못했습니다');
  return block.text;
}

async function callGemini(apiKey, model, systemPrompt, userMsg, signal){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const res = await fetch(url, {
    method: 'POST',
    signal,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: systemPrompt }] },
      contents: [{ role: 'user', parts: [{ text: userMsg }] }],
      generationConfig: { maxOutputTokens: 8000 }
    })
  });
  if (!res.ok){ throw new Error(`Gemini API 오류 (${res.status}): ${(await res.text()).slice(0,200)}`); }
  const data = await res.json();
  const parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
  if (!parts) throw new Error('응답에서 분석 결과를 찾지 못했습니다');
  return parts.map(p => p.text || '').join('');
}

async function callOpenAICompatible(apiKey, endpoint, model, systemPrompt, userMsg, signal){
  const res = await fetch(endpoint, {
    method: 'POST',
    signal,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model: model,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userMsg }
      ],
      max_tokens: 8000
    })
  });
  if (!res.ok){ throw new Error(`API 오류 (${res.status}): ${(await res.text()).slice(0,200)}`); }
  const data = await res.json();
  const msg = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (!msg) throw new Error('응답에서 분석 결과를 찾지 못했습니다');
  return msg;
}

async function testConnection(provider, cfg){
  if (!cfg.apiKey) throw new Error('API 키를 입력해주세요');
  if (provider === 'custom' && !cfg.endpoint) throw new Error('엔드포인트 URL을 입력해주세요');
  await callAI(provider, cfg, '당신은 연결 테스트용 어시스턴트입니다. "ok"라고만 답하세요.', 'ping');
}

/* ============================================================
   마크다운 → 섹션 렌더링
============================================================ */
function splitSections(md){
  md = (md || '').trim();
  const chunks = md.split(/\n(?=##\s+)/);
  const sections = [];
  for (let chunk of chunks){
    chunk = chunk.trim();
    if (!chunk) continue;
    const m = chunk.match(/^##\s+(.+)/);
    if (m){
      sections.push({ title: m[1].trim(), body: chunk.slice(m[0].length).trim() });
    } else {
      sections.push({ title: '분석 결과', body: chunk });
    }
  }
  if (sections.length === 0) sections.push({ title: '분석 결과', body: md });
  return sections;
}

const SECTION_ICONS = {
  '세계관 & 배경': '🌫️',
  '난이도 & 진행 주의점': '⚠️',
  '주의사항 & 트리거': '🩸',
  'NPC 분석': '🎭',
  'KPC 롤플레잉 팁': '📜',
  '분기점 & 개변 가이드': '🧭',
  '묘사·연출 확장': '🕯️',
  '종합 마스터링 조언': '🗝️'
};

function inlineMd(s){
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
}

function mdToHtml(md){
  const lines = (md || '').split(/\r?\n/);
  let html = '';
  let inList = false;
  for (const raw of lines){
    const line = raw.trim();
    if (line === ''){
      if (inList){ html += '</ul>'; inList = false; }
      continue;
    }
    if (/^[-*]\s+/.test(line)){
      if (!inList){ html += '<ul>'; inList = true; }
      html += `<li>${inlineMd(line.replace(/^[-*]\s+/, ''))}</li>`;
      continue;
    }
    if (inList){ html += '</ul>'; inList = false; }
    if (/^###\s+/.test(line)){
      html += `<p><b>${inlineMd(line.replace(/^###\s+/, ''))}</b></p>`;
    } else {
      html += `<p>${inlineMd(line)}</p>`;
    }
  }
  if (inList) html += '</ul>';
  return html || '<p style="color:var(--muted)">내용 없음</p>';
}

/* ============================================================
   스크립트 정리 — 한글 조사(받침) 보정
============================================================ */
function hasBatchim(word){
  if (!word) return false;
  for (let i = word.length - 1; i >= 0; i--){
    const code = word.charCodeAt(i);
    if (code >= 0xAC00 && code <= 0xD7A3){
      const jong = (code - 0xAC00) % 28;
      return jong !== 0;
    }
    if (/[A-Za-z0-9]/.test(word[i])) return false;
  }
  return false;
}
// 로/으로 조사 선택 (받침 있으면 으로, 없거나 ㄹ받침이면 로)
function particleRo(word){
  if (!word) return '로';
  const last = word[word.length - 1];
  const code = last.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return hasBatchim(word) ? '으로' : '로';
  const jong = (code - 0xAC00) % 28;
  if (jong === 0 || jong === 8) return '로'; // 받침 없음 또는 ㄹ받침
  return '으로';
}
// 이름 치환 후 그 이름 뒤에 붙는 조사를 받침 유무에 맞게 고쳐준다 (이/가, 은/는, 을/를, 과/와, 이랑/랑, 으로/로)
function fixKoreanJosa(text, name){
  if (!name) return text;
  const batchim = hasBatchim(name);
  const josaPairs = [
    { pattern: /(?:\(이\)?가|이\(가\)|이\/가|이|가)/, yes: '이', no: '가' },
    { pattern: /(?:\(은\)?는|은\(는\)|은\/는|은|는)/, yes: '은', no: '는' },
    { pattern: /(?:\(을\)?를|을\(를\)|을\/를|을|를)/, yes: '을', no: '를' },
    { pattern: /(?:\(과\)?와|과\(와\)|과\/와|과|와)/, yes: '과', no: '와' },
    { pattern: /(?:\(이\)?랑|이\(랑\)|이\/랑|이랑|랑)/, yes: '이랑', no: '랑' },
    { pattern: /(?:\(으\)?로|으\(로\)|으\/로|으로|로)/, yes: '으로', no: '로' }
  ];
  let fixed = text;
  josaPairs.forEach(pair => {
    const escapedName = escapeRegExp(name);
    // (?![가-힣]) : 뒤에 한글이 더 이어지면(=긴 단어의 일부) 조사로 보지 않고 건너뜀
    const regex = new RegExp(escapedName + '\\s*(?:' + pair.pattern.source + ')(?![가-힣])', 'g');
    fixed = fixed.replace(regex, () => name + (batchim ? pair.yes : pair.no));
  });
  return fixed;
}

/* ============================================================
   스크립트 정리 — 이름 치환 (KPC / PC / 탐사자 → 실제 이름, 조사 자동보정)
============================================================ */
function substituteNames(text, kpcName, pcName){
  let out = text;
  if (kpcName){
    out = out.split('KPC').join(kpcName);
    out = fixKoreanJosa(out, kpcName);
  }
  if (pcName){
    out = out.replace(/탐사자|PC/g, pcName);
    out = fixKoreanJosa(out, pcName);
  }
  return out;
}

// 다인 모드: HO1~HO4 슬롯별 이름 치환
function substituteMultiNames(text, names){
  const targets = [
    { name: names.ho1, keywords: ['HO1','ho1','Ho1','핸드아웃1','PC1','pc1','탐사자1'] },
    { name: names.ho2, keywords: ['HO2','ho2','Ho2','핸드아웃2','PC2','pc2','탐사자2'] },
    { name: names.ho3, keywords: ['HO3','ho3','Ho3','핸드아웃3','PC3','pc3','탐사자3'] },
    { name: names.ho4, keywords: ['HO4','ho4','Ho4','핸드아웃4','PC4','pc4','탐사자4'] }
  ];
  let out = text;
  targets.forEach(t => {
    if (!t.name) return;
    t.keywords.forEach(k => { out = out.split(k).join(t.name); });
    out = fixKoreanJosa(out, t.name);
  });
  return out;
}

/* ============================================================
   스크립트 정리 — PDF 줄바꿈 보정
============================================================ */
// 이 패턴으로 "시작"하는 줄은 공백 없이 앞 문단에 접합 (한글 문장 어미/조사 계열 — 단어 중간 줄바꿈 복원용)
const GLUE_NO_SPACE_RE = /^(니다|습니다|ㅂ니다|니까|습니까|는데요|던데요|의)(?=[\s.!?,)"'’”]|$)/;

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// KP/핸드아웃/링크류 줄은 문단 병합 대상에서 미리 빼둔다 (문장부호 없이 끝나도 다음 줄에 안 붙게)
const SPECIAL_LINE_RE = /키퍼|KP|kp|핸드아웃|비밀번호|Handout|http|bgm|브금/i;

function repairPdfLineWraps(text){
  const cleaned = text.replace(/\f/g, '\n'); // 페이지 나눔 문자 제거
  const lines = cleaned.replace(/\r\n/g, '\n').split('\n');
  const paragraphs = [];
  let buffer = '';

  for (const raw of lines){
    const line = raw.trim();
    if (line === ''){
      if (buffer){ paragraphs.push(buffer); buffer = ''; }
      continue;
    }
    if (SPECIAL_LINE_RE.test(line)){
      if (buffer){ paragraphs.push(buffer); buffer = ''; }
      paragraphs.push(line);
      continue;
    }
    const endsWithTerminator = /[.!?…。"'’”)\]]$/.test(buffer);
    if (buffer === ''){
      buffer = line;
    } else if (endsWithTerminator){
      paragraphs.push(buffer);
      buffer = line;
    } else if (GLUE_NO_SPACE_RE.test(line)){
      buffer += line;
    } else {
      buffer += ' ' + line;
    }
  }
  if (buffer) paragraphs.push(buffer);
  return paragraphs;
}

/* ============================================================
   스크립트 정리 — 문장 분리 & 블록 분류 (인용부호/괄호 보호 적용)
============================================================ */
// 따옴표/괄호/꺾쇠 안쪽 내용을 임시 토큰으로 감춰서, 그 안의 쉼표·마침표가
// 문장/쉼표 분리 로직에 영향받지 않게 한다.
function protectQuotedSegments(text){
  const store = [];
  let out = text.replace(/(\d+)\./g, '$1\u0004'); // "1." 같은 번호매김/소수점 보호
  const patterns = [
    /“[^”]*”/g, /"[^"\n]*"/g, /‘[^’]*’/g, /'[^'\n]*'/g,
    /\[\[[^\]]*\]\]/g, /\([^)]*\)/g, /\[[^\]]*\]/g,
    /「[^」]*」/g, /『[^』]*』/g, /<[^>]*>/g
  ];
  patterns.forEach(pattern => {
    out = out.replace(pattern, (match) => {
      store.push(match);
      return `\u0002_${store.length - 1}_\u0002`;
    });
  });
  return { text: out, store };
}
function restoreProtected(text, store){
  let out = text.replace(/\u0004/g, '.');
  for (let i = store.length - 1; i >= 0; i--){
    out = out.split(`\u0002_${i}_\u0002`).join(store[i]);
  }
  return out;
}

function splitIntoSentences(paragraph, commaSplit){
  const { text: protectedText, store } = protectQuotedSegments(paragraph);
  const rawSegments = protectedText
    .replace(/([.!?。．…⋯]+(?:\u0002_\d+_\u0002)?)/g, '$1\u0007')
    .split('\u0007')
    .map(s => s.trim())
    .filter(Boolean);

  if (!commaSplit){
    return rawSegments.map(s => restoreProtected(s, store).trim()).filter(Boolean);
  }

  const result = [];
  rawSegments.forEach(sentence => {
    const tokens = sentence.split(/([,、])/);
    let chunk = '', checkSoFar = '';
    for (let i = 0; i < tokens.length; i++){
      const token = tokens[i];
      if (!token) continue;
      if (token === ',' || token === '、'){
        const checkStr = restoreProtected(checkSoFar, store).trim();
        const nextStr = restoreProtected(tokens.slice(i + 1).join(''), store).trim();
        if (checkStr.length >= 8 && nextStr.length >= 8){
          const finalChunk = restoreProtected(chunk, store).trim();
          if (finalChunk) result.push(finalChunk + token);
          chunk = ''; checkSoFar = '';
        } else {
          chunk += token;
        }
        checkSoFar += token;
      } else {
        chunk += token; checkSoFar += token;
      }
    }
    if (chunk.trim()){
      const finalChunk = restoreProtected(chunk, store).trim();
      if (finalChunk) result.push(finalChunk);
    }
  });
  return result;
}

function classifyBlock(text){
  if (/BGM|브금|https?:\/\/|www\./i.test(text)) return 'bgm';
  return 'normal';
}

// PDF/OCR 추출 시 조사 앞에 잘못 낀 공백을 흡수 ("학교 는" → "학교는")
// '하며'/'이'는 일부러 제외함 — "조용히 하며", "이 세계" 같은 정상 띄어쓰기까지
// 잘못 붙여버리는 부작용이 있었음.
function absorbStrayJosaSpace(text){
  return text.replace(/([가-힣])\s+(가|은|는|을|를|과|와|의|에|에서|고|라고|했습니다|입니다|였다|였습니다)(\s|[,.!?\n]|$)/g, '$1$2$3');
}

// CoC 7판 공식 기술(스킬) 목록 — 판정 라벨 자동 인식용
const SKILL_LIST = [
  '회계','인류학','감정','고고학','예술/공예','매혹','등반','신용','크툴루 신화','변장','회피',
  '운전(자동차)','전기수리','화술','근접전(격투)','사격(권총)','사격(라이플/샷건)','사격(기관총)',
  '사격(활)','사격(중화기)','응급처치','역사','위협','도약','모국어','타언어','법률','도서관 이용',
  '듣기','열쇠공학','기계수리','의학','자연','항법','오컬트','중장비 조작','설득','조종','정신분석',
  '심리학','승마','과학','손재주','관찰력','잠복','생존','수영','던지기','추적','항해','잠수'
];
const ANNOT_LABEL_WORDS = ['annot','Annot','ANNOT','키퍼노트','키퍼 노트','GM노트','GM 노트','진행 팁'];

function matchSkillLabel(p){
  const t = p.trim();
  if (!t || t.length > 14 || /[.!?…。]/.test(t)) return null;
  const bare = t.replace(/\(.*?\)/g, '').split('/')[0].trim();
  return (SKILL_LIST.includes(bare) || SKILL_LIST.includes(t.replace(/\(.*?\)/g,'').trim())) ? t : null;
}
function matchAnnotLabel(p){
  const t = p.trim();
  return ANNOT_LABEL_WORDS.includes(t) ? t : null;
}
function matchDialogue(p){
  const t = p.trim();
  let m = t.match(/^([가-힣A-Za-z·]{1,10}(?:\s[가-힣A-Za-z·]{1,10}){0,2})\s*[“"]/);
  if (m && m[1].length <= 12) return { speaker: m[1].trim() };
  if (/^[“"]/.test(t)) return { speaker: null };
  return null;
}

function classifyParagraphs(paragraphs, commaSplit){
  const blocks = [];
  let pending = null; // 직전 줄이 '판정'/'Annot' 라벨이었는지 여부

  paragraphs.forEach(p => {
    const handoutIdx = p.search(/핸드아웃|비밀번호|Handout/i);
    const kpMatch = p.match(/KP(?![A-Za-z])/);
    const kpIdx = kpMatch ? kpMatch.index : -1;
    if (handoutIdx !== -1 || kpIdx !== -1){
      const isKpFirst = kpIdx !== -1 && (handoutIdx === -1 || kpIdx < handoutIdx);
      blocks.push({ text: p, type: isKpFirst ? 'kp' : 'handout' });
      pending = null; return;
    }

    if (matchAnnotLabel(p)){
      blocks.push({ text: p, type: 'annot-label' });
      pending = 'annot'; return;
    }
    // 줄 안에 "판정"이라는 글자가 그대로 있으면(예: "관찰력 판정") 그 자체로 완결된 판정 블록
    if (p.includes('판정')){
      blocks.push({ text: p, type: 'skill' });
      pending = null; return;
    }
    if (matchSkillLabel(p)){
      blocks.push({ text: p, type: 'skill' });
      pending = 'skill'; return;
    }
    if (pending){
      const t = pending === 'annot' ? 'annot' : 'skill-result';
      splitIntoSentences(p, commaSplit).forEach(s => blocks.push({ text: s, type: t }));
      pending = null; return;
    }

    const dlg = matchDialogue(p);
    if (dlg){
      blocks.push({ text: p, type: 'dialogue', speaker: dlg.speaker || null });
      pending = null; return;
    }

    splitIntoSentences(p, commaSplit).forEach(s => blocks.push({ text: s, type: classifyBlock(s) }));
    pending = null;
  });

  blocks.forEach(b => { b.text = absorbStrayJosaSpace(b.text); });
  return blocks;
}

function applyDescPrefix(blocks, descMode){
  if (!descMode) return blocks;
  const NARRATION_TYPES = { normal: 1, heading: 1 };
  blocks.forEach(b => {
    if (NARRATION_TYPES[b.type] && !b.text.startsWith('/desc ')){
      b.text = '/desc ' + b.text;
    }
  });
  return blocks;
}

function convertScript(rawText, names, commaSplit, pdfRepair, descMode){
  const paragraphs = pdfRepair
    ? repairPdfLineWraps(rawText)
    : rawText.replace(/\r\n/g, '\n').split('\n').map(p => p.trim()).filter(Boolean);
  const substituted = paragraphs.map(p => {
    let out = names.mode === 'multi' ? substituteMultiNames(p, names) : substituteNames(p, names.kpc, names.pc);
    return out;
  });
  const blocks = classifyParagraphs(substituted, commaSplit);
  return applyDescPrefix(blocks, descMode);
}

async function handleScriptPdfUpload(e){
  const file = e.target.files[0];
  if (!file) return;
  const nameEl = document.getElementById('scriptPdfFileName');
  nameEl.textContent = `추출 중... (${file.name})`;
  try {
    const { text, numPages } = await extractPdfText(file, (i, total) => {
      nameEl.textContent = `추출 중... (${file.name}) ${i}/${total}페이지`;
    });
    document.getElementById('scriptRawInput').value = text;
    nameEl.textContent = `✓ ${file.name} (${numPages}페이지 추출 완료)`;
    if (!document.getElementById('scriptTitleInput').value){
      document.getElementById('scriptTitleInput').value = file.name.replace(/\.pdf$/i, '');
    }
  } catch (err){
    console.error(err);
    nameEl.textContent = '추출 실패 — 본문을 직접 붙여넣어 주세요';
  }
}

const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

// 비공식 구글 번역 엔드포인트로 일본어→한국어 청크 번역 (실패 시 원문 유지)
async function translateTextChunk(text){
  if (!text.trim()) return text;
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=ko&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data && data[0]){
      let out = '';
      data[0].forEach(part => { if (part[0]) out += part[0]; });
      return out;
    }
    return text;
  } catch (e){
    console.error('번역 실패', e);
    return text;
  }
}

async function translateBlocksToKorean(blocks, onProgress){
  const SAFE_LIMIT = 500;
  const SEPARATOR = ' ▣ ';
  let i = 0;
  let failCount = 0;
  while (i < blocks.length){
    let chunkText = '';
    const idxs = [];
    if (onProgress) onProgress(i, blocks.length);
    while (i < blocks.length){
      const t = blocks[i].text;
      if (chunkText.length + t.length + SEPARATOR.length > SAFE_LIMIT && chunkText.length > 0) break;
      chunkText += (chunkText ? SEPARATOR : '') + t;
      idxs.push(i);
      i++;
    }
    if (chunkText.trim()){
      const translated = await translateTextChunk(chunkText);
      const parts = translated.split(/▣/g).map(s => s.trim());
      if (parts.length === idxs.length){
        idxs.forEach((origIdx, subIdx) => { if (parts[subIdx]) blocks[origIdx].text = parts[subIdx]; });
      } else {
        for (const idx of idxs){
          blocks[idx].text = await translateTextChunk(blocks[idx].text);
          await sleep(20);
          failCount++;
        }
      }
      await sleep(50);
    }
  }
  return failCount;
}

function extractLinksFromBlocks(blocks){
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  const links = [];
  blocks.forEach(b => {
    const found = b.text.match(urlRegex);
    if (found) found.forEach(l => { if (!links.includes(l)) links.push(l); });
  });
  return links;
}

function computeScriptStats(blocks){
  const charCount = blocks.reduce((sum, b) => sum + (b.text ? b.text.length : 0), 0);
  const estMinutes = Math.ceil(charCount / 220) * 2;
  return { charCount, estMinutes };
}

async function runScriptConversion(){
  const title = document.getElementById('scriptTitleInput').value.trim();
  const rawText = document.getElementById('scriptRawInput').value;
  const commaSplit = document.getElementById('scriptCommaSplit').checked;
  const pdfRepair = document.getElementById('scriptPdfRepair').checked;
  const descMode = document.getElementById('scriptDescMode').checked;
  const jpTranslate = document.getElementById('scriptJpTranslate').checked;
  const extractLink = document.getElementById('scriptExtractLink').checked;
  const calcStats = document.getElementById('scriptCalcStats').checked;

  if (!rawText.trim()){
    showToast('스크립트 원고를 입력해주세요');
    return;
  }

  let names;
  if (scriptMode === 'multi'){
    names = {
      mode: 'multi',
      ho1: document.getElementById('scriptHo1').value.trim(),
      ho2: document.getElementById('scriptHo2').value.trim(),
      ho3: document.getElementById('scriptHo3').value.trim(),
      ho4: document.getElementById('scriptHo4').value.trim()
    };
  } else {
    names = { mode: 'tyeman', kpc: document.getElementById('scriptKpcName').value.trim(), pc: document.getElementById('scriptPcName').value.trim() };
  }

  const runBtn = document.getElementById('scriptRunBtn');
  runBtn.disabled = true;
  runBtn.textContent = '변환 중...';

  const blocks = convertScript(rawText, names, commaSplit, pdfRepair, descMode);

  let translateFailCount = 0;
  if (jpTranslate){
    translateFailCount = await translateBlocksToKorean(blocks, (i, total) => {
      runBtn.textContent = `번역 중... (${i}/${total})`;
    });
  }

  const links = extractLink ? extractLinksFromBlocks(blocks) : [];
  const stats = calcStats ? computeScriptStats(blocks) : null;

  const defaultTitle = names.mode === 'multi' ? '다인 스크립트' : `${names.kpc || 'KPC'} 스크립트`;
  const record = {
    id: uid(),
    type: 'script',
    title: title || defaultTitle,
    names, commaSplit, pdfRepair, descMode, jpTranslate, extractLink, calcStats,
    translateFailCount,
    createdAt: Date.now(),
    blocks, links, stats
  };
  await dbPut(record);
  currentDoc = record;
  renderScriptResultView(record);
  await refreshHistory();
}

let scriptPlayModeActive = false;
let scriptPlayIndex = 0;
let scriptPlayableBlocks = [];

function scriptNamesSummary(record){
  const n = record.names;
  if (!n) return '';
  if (n.mode === 'multi'){
    const parts = [n.ho1, n.ho2, n.ho3, n.ho4].filter(Boolean);
    return parts.length ? `다인 · ${parts.join(' / ')}` : '다인 모드';
  }
  return `KPC: ${n.kpc || '-'} · PC: ${n.pc || '-'}`;
}

function renderScriptResultView(record){
  const content = document.getElementById('content');
  const blocksHtml = (record.blocks || []).map((b, idx) => scriptBlockHtml(b, idx)).join('')
    || '<div class="script-empty">블록이 없습니다</div>';

  const statsHtml = record.stats ? `
    <div class="stats-row">
      <div class="stats-pill">총 글자 수: ${record.stats.charCount.toLocaleString()}자</div>
      <div class="stats-pill">예상 세션 시간: 약 ${record.stats.estMinutes}분</div>
    </div>` : '';

  const warnHtml = (record.jpTranslate && record.translateFailCount > 0) ? `
    <div class="trigger-item" style="margin-bottom:14px;">⚠ 번역 요청 중 ${record.translateFailCount}건이 실패해 원문(일본어)이 남아있을 수 있어요. 확인해주세요.</div>` : '';

  const linksHtml = (record.links && record.links.length) ? `
    <div class="link-card">
      <div class="link-card-head">
        <div class="field-label">세션 링크 모음 (BGM / 자료)</div>
        <button class="ghost-btn" onclick="copyAllScriptLinks()">전체 복사</button>
      </div>
      ${record.links.map(l => `
        <div class="link-row">
          <a href="${escapeHtml(l)}" target="_blank" rel="noopener">${escapeHtml(l)}</a>
          <button class="ghost-btn" onclick="copySingleText('${escapeHtml(l).replace(/'/g,"\\'")}')">복사</button>
        </div>
      `).join('')}
    </div>` : '';

  content.innerHTML = `
    <div class="script-header">
      <div>
        <div class="script-title">${escapeHtml(record.title)}</div>
        <div class="script-sub">${escapeHtml(scriptNamesSummary(record))}</div>
      </div>
      <div class="result-actions">
        <button class="ghost-btn" id="scriptPlayModeBtn" onclick="toggleScriptPlayMode()">▶ 진행 모드</button>
        <button class="ghost-btn" onclick="copyScriptAsText()">전체 복사</button>
        <button class="ghost-btn" onclick="startNewScript()">새 스크립트</button>
      </div>
    </div>
    ${statsHtml}
    ${warnHtml}
    ${linksHtml}
    <div class="block-list" id="blockList">${blocksHtml}</div>
  `;

  scriptPlayModeActive = false;
  scriptPlayIndex = 0;
  refreshScriptPlayableBlocks();
}

const BLOCK_TYPE_LABELS = {
  normal: '지문', bgm: 'BGM', handout: '핸드아웃', kp: 'KP정보',
  heading: '장면제목', skill: '판정', 'skill-result': '판정결과',
  'annot-label': 'Annot', annot: 'Annot내용', dialogue: '대사'
};

function scriptBlockHtml(block, idx){
  const speakerHtml = block.speaker ? `<div class="block-speaker">${escapeHtml(block.speaker)}</div>` : '';
  const options = Object.entries(BLOCK_TYPE_LABELS)
    .map(([val, label]) => `<option value="${val}" ${block.type === val ? 'selected' : ''}>${label}</option>`)
    .join('');
  return `
    <div class="script-block playable type-${block.type}" data-idx="${idx}" onclick="handleScriptBlockClick(${idx}, this)">
      ${speakerHtml}
      <div class="block-text" id="blockText_${idx}">${escapeHtml(block.text)}</div>
      <div class="block-actions">
        <span onclick="event.stopPropagation(); editBlock(${idx})">수정</span>
        <span class="del-action" onclick="event.stopPropagation(); deleteBlock(${idx})">삭제</span>
        <select class="block-type-select" onclick="event.stopPropagation()" onchange="changeBlockType(${idx}, this.value)">${options}</select>
      </div>
    </div>
  `;
}

function changeBlockType(idx, newType){
  if (!currentDoc || !currentDoc.blocks) return;
  currentDoc.blocks[idx].type = newType;
  dbPut(currentDoc).then(() => renderScriptResultView(currentDoc));
}

function editBlock(idx){
  const el = document.getElementById('blockText_' + idx);
  if (!el) return;
  const isEditing = el.getAttribute('contenteditable') === 'true';
  if (!isEditing){
    el.setAttribute('contenteditable', 'true');
    el.focus();
    document.execCommand('selectAll', false, null);
  } else {
    el.setAttribute('contenteditable', 'false');
    if (currentDoc && currentDoc.blocks){
      currentDoc.blocks[idx].text = el.textContent;
      dbPut(currentDoc);
      if (currentDoc.stats){
        currentDoc.stats = computeScriptStats(currentDoc.blocks);
        dbPut(currentDoc);
      }
    }
  }
}

function deleteBlock(idx){
  if (!currentDoc || !currentDoc.blocks) return;
  currentDoc.blocks.splice(idx, 1);
  if (currentDoc.stats) currentDoc.stats = computeScriptStats(currentDoc.blocks);
  dbPut(currentDoc).then(() => renderScriptResultView(currentDoc));
}

function copyScriptAsText(){
  if (!currentDoc || !currentDoc.blocks) return;
  const out = currentDoc.blocks.map(b => b.text).join('\n\n');
  navigator.clipboard.writeText(out).then(() => showToast('클립보드에 복사되었습니다'));
}

function copySingleText(text){
  navigator.clipboard.writeText(text).then(() => showToast('복사되었습니다'));
}

function copyAllScriptLinks(){
  if (!currentDoc || !currentDoc.links) return;
  navigator.clipboard.writeText(currentDoc.links.join('\n')).then(() => showToast('링크 전체 복사 완료'));
}

/* ============================================================
   스크립트 정리 — 진행 모드 (클릭 시 복사 + 다음 줄로 자동 이동)
============================================================ */
function refreshScriptPlayableBlocks(){
  scriptPlayableBlocks = Array.from(document.querySelectorAll('.script-block.playable'));
  if (scriptPlayIndex >= scriptPlayableBlocks.length) scriptPlayIndex = Math.max(0, scriptPlayableBlocks.length - 1);
}

function highlightCurrentScriptPlayBlock(){
  scriptPlayableBlocks.forEach(b => b.classList.remove('play-current'));
  const cur = scriptPlayableBlocks[scriptPlayIndex];
  if (cur){
    cur.classList.add('play-current');
    cur.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function toggleScriptPlayMode(){
  scriptPlayModeActive = !scriptPlayModeActive;
  const btn = document.getElementById('scriptPlayModeBtn');
  const floatBtn = document.getElementById('floatingNextBtn');
  if (btn) btn.textContent = scriptPlayModeActive ? '■ 진행 모드 종료' : '▶ 진행 모드';
  if (scriptPlayModeActive){
    scriptPlayIndex = 0;
    refreshScriptPlayableBlocks();
    highlightCurrentScriptPlayBlock();
    if (!floatBtn){
      const btnEl = document.createElement('button');
      btnEl.id = 'floatingNextBtn';
      btnEl.textContent = '다음 줄 복사 ▶';
      btnEl.onclick = advanceScriptPlayMode;
      document.body.appendChild(btnEl);
    }
  } else {
    scriptPlayableBlocks.forEach(b => b.classList.remove('play-current'));
    if (floatBtn) floatBtn.remove();
  }
}

function advanceScriptPlayMode(){
  if (!scriptPlayableBlocks.length) return;
  const cur = scriptPlayableBlocks[scriptPlayIndex];
  if (!cur) return;
  copySingleText(cur.querySelector('.block-text').innerText);
  if (scriptPlayIndex < scriptPlayableBlocks.length - 1){
    scriptPlayIndex++;
    highlightCurrentScriptPlayBlock();
  } else {
    showToast('마지막 줄입니다');
  }
}

function handleScriptBlockClick(idx, el){
  if (el.querySelector('.block-text').getAttribute('contenteditable') === 'true') return;
  copySingleText(el.querySelector('.block-text').innerText);
  if (scriptPlayModeActive){
    const pos = scriptPlayableBlocks.indexOf(el);
    if (pos !== -1){
      scriptPlayIndex = Math.min(pos + 1, scriptPlayableBlocks.length - 1);
      highlightCurrentScriptPlayBlock();
    }
  }
}
</script>
</body>
</html>
